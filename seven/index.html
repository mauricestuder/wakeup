<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Seven-Nil">
  <meta name="theme-color" content="#0b1f14">
  <meta name="description" content="Seven-Nil: draft a dream XI from World Cup legends and try to win all seven matches.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Seven-Nil</title>
  <style>
    :root { --bg: #0b1f14; --panel: #12301f; --panel2: #18402a; --line: #2a5a3e; --text: #eef5ea; --muted: #9bb8a4;
      --gold: #f2c94c; --win: #3ccf6e; --draw: #e8b93a; --loss: #e5534b; --grass1: #1f7a3f; --grass2: #1b6e38; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; }
    .screen { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .screen[hidden] { display: none !important; }
    .btn { background: var(--gold); color: #1a1405; font-weight: 800; padding: 14px 22px; border-radius: 12px; font-size: 17px; }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn.ghost { background: var(--panel2); color: var(--text); font-weight: 600; }
    .muted { color: var(--muted); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }

    /* Setup */
    #setup { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; padding-top: 6vh; }
    .logo { font-size: clamp(64px, 18vw, 140px); font-weight: 900; line-height: .9; letter-spacing: -.04em; color: var(--gold); }
    .logo small { display: block; font-size: .24em; letter-spacing: .3em; color: var(--text); margin-top: 8px; }
    .tag { max-width: 460px; line-height: 1.45; margin: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chip { background: var(--panel2); border: 2px solid transparent; padding: 10px 14px; border-radius: 999px; font-weight: 700; }
    .chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
    .label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    #stats { font-size: 14px; }

    /* Draft */
    .draft { display: grid; gap: 16px; }
    @media (min-width: 880px) { .draft { grid-template-columns: minmax(340px, 460px) 1fr; align-items: start; } }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .pill { background: var(--panel2); padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; }
    .pitch { position: relative; aspect-ratio: 68 / 88; border-radius: 14px; overflow: hidden; border: 2px solid #ffffff30;
      background: repeating-linear-gradient(to bottom, var(--grass1) 0 10%, var(--grass2) 10% 20%); }
    .pitch::before { content: ''; position: absolute; inset: 4%; border: 2px solid #ffffff55; border-radius: 4px; pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 13%, #ffffff55 13% calc(13% + 2px), transparent calc(13% + 2px)),
        linear-gradient(#ffffff55, #ffffff55) 0 50% / 100% 2px no-repeat; }
    .pitch::after { content: ''; position: absolute; left: 28%; right: 28%; bottom: 4%; height: 13%; border: 2px solid #ffffff55; border-bottom: 0; pointer-events: none; }
    .slot { position: absolute; transform: translate(-50%, -50%); width: 21%; display: flex; flex-direction: column; align-items: center;
      background: none; padding: 0; z-index: 1; }
    .slot .dot { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px;
      background: #00000040; border: 2px dashed #ffffffaa; }
    .slot.filled .dot { background: var(--text); color: var(--bg); border: 2px solid #fff; font-size: 16px; }
    .slot .nm { margin-top: 3px; font-size: 11px; font-weight: 700; line-height: 1.1; text-shadow: 0 1px 2px #000; text-align: center;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot .fl { font-size: 10px; opacity: .85; text-shadow: 0 1px 2px #000; }
    .slot.target .dot { border: 3px solid var(--gold); background: #f2c94c55; animation: pulse 1s infinite; }
    .slot:disabled { cursor: default; }
    @keyframes pulse { 50% { transform: scale(1.12); } }
    .ratings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; text-align: center; }
    .ratings div { background: var(--panel); border-radius: 10px; padding: 8px 4px; }
    .ratings b { display: block; font-size: 22px; }
    .ratings span { font-size: 11px; color: var(--muted); letter-spacing: .1em; }

    .spinbox { display: flex; align-items: center; gap: 14px; }
    .flag { font-size: 52px; line-height: 1; }
    .nation { font-size: 26px; font-weight: 800; line-height: 1.1; }
    .year { font-size: 18px; color: var(--gold); font-weight: 700; }
    .spinbox.rolling .flag, .spinbox.rolling .nation, .spinbox.rolling .year { filter: blur(1px); opacity: .7; }
    .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .actions .btn { flex: 1; min-width: 140px; }
    .note { font-size: 13px; color: var(--muted); margin: 10px 0 0; min-height: 1em; }
    .list { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
    .row { display: grid; grid-template-columns: 1fr auto 44px; gap: 10px; align-items: center; text-align: left;
      background: var(--panel2); padding: 10px 12px; border-radius: 10px; border: 2px solid transparent; }
    .row:disabled { opacity: .35; cursor: default; }
    .row.sel { border-color: var(--gold); }
    .row .pn { font-weight: 700; }
    .poss { display: flex; gap: 4px; }
    .pos { font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 6px; background: #00000040; }
    .r { font-size: 20px; font-weight: 900; text-align: right; }
    .blind .r, .blind .ratings, .blind .slot .dot b { visibility: hidden; }
    #kickoff { width: 100%; margin-top: 14px; }

    /* Cup */
    .rail { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
    .stage { text-align: center; padding: 8px 2px; border-radius: 10px; background: var(--panel); font-size: 12px; font-weight: 800; color: var(--muted); }
    .stage.now { outline: 2px solid var(--gold); color: var(--text); }
    .stage.W { background: var(--win); color: #062010; } .stage.D { background: var(--draw); color: #241a02; } .stage.L { background: var(--loss); color: #fff; }
    .stage small { display: block; font-weight: 600; font-size: 11px; margin-top: 2px; }
    .match { text-align: center; }
    .round { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 800; }
    .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 16px 0 6px; }
    .team { font-weight: 800; font-size: 18px; } .team .flag { display: block; font-size: 44px; margin-bottom: 4px; }
    .team small { display: block; color: var(--muted); font-weight: 600; font-size: 13px; }
    .score { font-size: 56px; font-weight: 900; font-variant-numeric: tabular-nums; min-width: 130px; }
    .clock { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
    .feed { list-style: none; padding: 0; margin: 14px auto 0; max-width: 460px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 40px; }
    .feed li { background: var(--panel2); padding: 8px 12px; border-radius: 8px; font-size: 14px; }
    .feed li.them { text-align: right; }
    .verdict { font-size: 22px; font-weight: 900; margin-top: 14px; min-height: 1.3em; }
    .verdict.W { color: var(--win); } .verdict.L { color: var(--loss); } .verdict.D { color: var(--draw); }
    .pens { margin-top: 8px; font-size: 20px; letter-spacing: 4px; }

    /* End */
    #end { text-align: center; }
    .big { font-size: clamp(54px, 15vw, 110px); font-weight: 900; line-height: 1; color: var(--gold); margin: 3vh 0 6px; }
    .emoji { font-size: 30px; letter-spacing: 4px; margin: 10px 0; }
    .xi { columns: 2; column-gap: 16px; text-align: left; max-width: 560px; margin: 18px auto; font-size: 14px; }
    .xi div { break-inside: avoid; padding: 4px 0; border-bottom: 1px solid var(--line); }
    .xi b { display: inline-block; width: 30px; color: var(--muted); font-size: 12px; }
    @media (max-width: 420px) { .xi { columns: 1; } .score { font-size: 44px; min-width: 96px; } .team { font-size: 15px; } }
    .row-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <section id="setup" class="screen">
    <div class="logo">7–0<small>SEVEN · NIL</small></div>
    <p class="tag muted">Spin a nation and a World Cup year, pick one legend from that squad, fill your XI. Then win all seven matches — three group games and four knockouts. Anything less isn't perfect.</p>
    <div>
      <div class="label">Formation</div>
      <div class="chips" id="forms"></div>
    </div>
    <div>
      <div class="label">Mode</div>
      <div class="chips" id="modes">
        <button class="chip" data-mode="classic" aria-pressed="true">Classic · ratings shown</button>
        <button class="chip" data-mode="blind" aria-pressed="false">Blind · from memory</button>
      </div>
    </div>
    <button class="btn" id="start">Start draft</button>
    <div id="stats" class="muted"></div>
  </section>

  <section id="draft" class="screen" hidden>
    <div class="draft">
      <div>
        <div class="topbar">
          <span class="pill" id="pickN">Pick 1 / 11</span>
          <span class="pill" id="formN">4-3-3</span>
        </div>
        <div class="pitch" id="pitch"></div>
        <div class="ratings" id="ratings"></div>
      </div>
      <div class="card">
        <div class="spinbox" id="spinbox">
          <div class="flag" id="sFlag">🌍</div>
          <div><div class="nation" id="sNation">Ready?</div><div class="year" id="sYear">Spin for a squad</div></div>
        </div>
        <div class="actions">
          <button class="btn" id="spin">Spin</button>
          <button class="btn ghost" id="reroll">Reroll (3)</button>
        </div>
        <p class="note" id="note"></p>
        <div class="list" id="list"></div>
        <button class="btn" id="kickoff" hidden>Kick off the World Cup →</button>
      </div>
    </div>
  </section>

  <section id="cup" class="screen" hidden>
    <div class="rail" id="rail"></div>
    <div class="card match">
      <div class="round" id="round"></div>
      <div class="teams">
        <div class="team" id="home"></div>
        <div><div class="score" id="score">0–0</div><div class="clock" id="clock">0'</div></div>
        <div class="team" id="away"></div>
      </div>
      <div class="pens" id="pens"></div>
      <div class="verdict" id="verdict"></div>
      <ul class="feed" id="feed"></ul>
      <div class="actions" style="justify-content:center">
        <button class="btn ghost" id="skip">Skip</button>
        <button class="btn" id="next" hidden>Next match</button>
      </div>
    </div>
  </section>

  <section id="end" class="screen" hidden>
    <div class="big" id="headline"></div>
    <div class="muted" id="sub"></div>
    <div class="emoji" id="emoji"></div>
    <div class="xi" id="xi"></div>
    <div class="row-btns">
      <button class="btn ghost" id="share">Copy result</button>
      <button class="btn" id="again">Play again</button>
    </div>
    <p class="note" id="shareNote" style="text-align:center"></p>
  </section>

  <script type="module" src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  </script>
</body>
</html>
