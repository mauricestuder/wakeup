<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14202e">
  <meta name="description" content="First Chair: an idle ski resort on a 3D mountain. Guests ride and ski on their own, you spend the money on lifts, speed, more guests and higher prices. Plays in the browser on phone and PC.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>First Chair</title>
  <style>
    :root { --ink: #14202e; --panel: rgba(20, 32, 46, .88); --solid: #1b2a3b; --line: rgba(255, 255, 255, .13); --text: #eef3f8; --dim: #9db0c4;
      --gold: #ffc247; --good: #46c979; --bad: #ff6b5e; --blue: #5cb3ff;
      --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text); font-family: var(--font);
      user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
    canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    b, h1, h2, h3 { font-weight: 750; }
    .num { font-variant-numeric: tabular-nums; }
    .glass { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

    /* ---------- HUD ---------- */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
    #hud > * { pointer-events: auto; }
    #top { position: absolute; left: calc(8px + var(--sl)); right: calc(8px + var(--sr)); top: calc(8px + var(--st)); display: flex; gap: 6px; align-items: stretch; pointer-events: none; }
    #top > * { pointer-events: auto; }
    .stat { display: flex; align-items: center; gap: 7px; height: 46px; padding: 0 13px; border-radius: 14px; white-space: nowrap; font-size: 15px; }
    .stat small { color: var(--dim); font-size: 12px; }
    #sMoney { gap: 9px; } #sMoney svg { color: var(--gold); width: 26px; height: 26px; }
    #sMoney b { font-size: 21px; line-height: 1; display: block; } #sMoney small { color: var(--good); font-weight: 700; display: block; margin-top: 2px; }
    #sFame { color: var(--gold); font-weight: 750; }
    .grow { flex: 1 1 0; min-width: 0; }
    .sq { width: 46px; justify-content: center; padding: 0; }

    #goal { position: absolute; left: calc(8px + var(--sl)); top: calc(62px + var(--st)); width: min(330px, calc(100% - 16px - var(--sl) - var(--sr))); padding: 8px 12px 9px; border-radius: 13px; font-size: 13.5px; line-height: 1.3; }
    #goal .t { display: flex; justify-content: space-between; gap: 8px; } #goal .t b { color: var(--gold); margin-right: 5px; } #goal .rw { color: var(--good); font-weight: 750; white-space: nowrap; }
    .meter { height: 6px; border-radius: 4px; background: rgba(255, 255, 255, .13); overflow: hidden; margin-top: 6px; } .meter i { display: block; height: 100%; border-radius: 4px; background: var(--good); transition: width .3s; }

    #labels { position: absolute; inset: 0; pointer-events: none !important; overflow: hidden; }
    .tag { position: absolute; left: 0; top: 0; padding: 2px 7px; border-radius: 9px; font-size: 12px; font-weight: 700;
      background: rgba(20, 32, 46, .82); border: 1px solid var(--line); white-space: nowrap; will-change: transform; }
    .tag.warn { background: #b9831c; } .tag.bad { background: #b3392f; }
    .pop { position: absolute; left: 0; top: 0; font-size: 15px; font-weight: 800; color: #ffe39a; white-space: nowrap; text-shadow: 0 1px 0 #3a2a05, 0 0 6px rgba(0, 0, 0, .55);
      animation: pop 1.15s ease-out forwards; }
    @keyframes pop { from { transform: translate(-50%, -100%); opacity: 1; } 70% { opacity: 1; } to { transform: translate(-50%, calc(-100% - 46px)); opacity: 0; } }

    /* ---------- the buttons ---------- */
    #deck { position: absolute; left: 50%; bottom: calc(8px + var(--sb)); transform: translateX(-50%); width: min(1180px, calc(100% - 16px - var(--sl) - var(--sr)));
      display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px; pointer-events: none; }
    .up { pointer-events: auto; position: relative; overflow: hidden; display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 9px; align-items: center; text-align: left;
      min-height: 92px; padding: 9px 11px 12px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: transform .08s, background .15s, border-color .15s; }
    .up .ic { width: 32px; height: 32px; grid-row: 1 / 3; color: var(--dim); }
    .up .nm { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; font-size: 15px; font-weight: 800; line-height: 1.15; }
    .up .nm i { font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--dim); white-space: nowrap; }
    .up .nt { font-size: 12px; color: var(--dim); line-height: 1.25; min-height: 30px; margin-top: 2px; }
    .up .pr { grid-column: 1 / 3; display: flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 16px; font-weight: 800; color: var(--dim); font-variant-numeric: tabular-nums; }
    .up .pr svg { width: 17px; height: 17px; }
    .up .fill { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--gold); opacity: .55; }
    .up.can { background: rgba(38, 58, 82, .94); border-color: rgba(255, 194, 71, .65); }
    .up.can .ic, .up.can .pr { color: var(--gold); } .up.can .fill { opacity: 1; }
    .up.can:hover { background: rgba(48, 72, 100, .96); }
    .up:active, .up.hit { transform: scale(.96); }
    .up.max .pr { color: var(--good); } .up.max .fill { display: none; }
    .up.locked { opacity: .7; }

    #rush { position: absolute; right: calc(10px + var(--sr)); bottom: calc(var(--deck, 100px) + 20px + var(--sb)); width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; align-content: center; gap: 1px;
      background: linear-gradient(160deg, #ff9a3d, #e5484d); color: #fff; border: 2px solid rgba(255, 255, 255, .5); box-shadow: 0 6px 18px rgba(0, 0, 0, .4); font-size: 12px; font-weight: 800; line-height: 1.1; }
    #rush .ic { width: 28px; height: 28px; stroke-width: 2.1; } #rush b { font-size: 12px; }
    #rush.wait { background: var(--solid); color: var(--dim); border-color: var(--line); box-shadow: none; }
    #rush.on { animation: glow .7s ease-in-out infinite alternate; }
    @keyframes glow { from { box-shadow: 0 0 0 0 rgba(255, 170, 60, .7); } to { box-shadow: 0 0 0 12px rgba(255, 170, 60, 0); } }
    #rush:active { transform: scale(.94); }

    #next { position: absolute; left: 50%; bottom: calc(var(--deck, 100px) + 20px + var(--sb)); transform: translateX(-50%); height: 56px; padding: 0 22px; border-radius: 16px; background: var(--gold); color: #1b1407; font-size: 17px; font-weight: 800;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .45); display: flex; align-items: center; gap: 8px; white-space: nowrap; }

    #toasts { position: absolute; left: 50%; top: calc(128px + var(--st)); transform: translateX(-50%); width: min(430px, calc(100% - 20px)); display: grid; gap: 6px; pointer-events: none !important; }
    .toast { padding: 9px 13px; border-radius: 12px; background: var(--solid); border: 1px solid var(--line); font-size: 14px; line-height: 1.35; text-align: center; box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
      animation: tin .25s ease-out; transition: opacity .35s; }
    .toast.star { border-color: rgba(255, 194, 71, .7); } .toast.star b { color: var(--gold); } .toast.out { opacity: 0; }
    @keyframes tin { from { transform: translateY(-8px); opacity: 0; } }

    /* ---------- start screen and windows ---------- */
    #menu { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: calc(20px + var(--st)) 20px calc(20px + var(--sb));
      background: linear-gradient(180deg, rgba(20, 32, 46, .5), rgba(20, 32, 46, .82)); }
    #menu .box { width: min(420px, 100%); text-align: center; }
    #menu h1 { font-size: clamp(44px, 12vw, 68px); letter-spacing: -1.5px; margin: 0; line-height: 1; text-shadow: 0 4px 20px rgba(0, 0, 0, .5); }
    #menu p { color: #d5e0ea; font-size: 16px; line-height: 1.45; margin: 12px 0 24px; text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 54px; border-radius: 15px; background: var(--solid); border: 1px solid var(--line); font-size: 16px; font-weight: 750; }
    .btn.gold { background: var(--gold); color: #1b1407; border-color: transparent; height: 64px; font-size: 20px; font-weight: 800; }
    .btn.bad { background: #8e2f28; border-color: transparent; }
    .btn + .btn { margin-top: 10px; }
    #menu small { display: block; margin-top: 14px; color: var(--dim); font-size: 13px; }

    #sheet { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: calc(14px + var(--st)) 14px calc(14px + var(--sb)); background: rgba(8, 14, 22, .6); }
    #sheetBox { width: min(460px, 100%); max-height: 100%; overflow: auto; touch-action: pan-y; padding: 18px; border-radius: 18px; background: var(--solid); border: 1px solid var(--line); position: relative; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
    #sheetBox h2 { margin: 0 34px 12px 0; font-size: 21px; }
    #sheetBox p { color: #cfdae6; font-size: 14.5px; line-height: 1.5; margin: 0 0 12px; }
    #sheetBox ul { margin: 0 0 14px; padding-left: 20px; color: #cfdae6; font-size: 14.5px; line-height: 1.55; }
    .x { position: absolute; right: 10px; top: 10px; width: 38px; height: 38px; border-radius: 10px; font-size: 24px; color: var(--dim); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 15px; }
    .row input[type=range] { width: 160px; accent-color: var(--gold); touch-action: pan-x; }
    .switch { width: 54px; height: 32px; border-radius: 16px; background: rgba(255, 255, 255, .16); position: relative; transition: background .15s; }
    .switch::after { content: ''; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .switch.on { background: var(--good); } .switch.on::after { transform: translateX(22px); }

    /* ---------- phones ---------- */
    @media (max-width: 760px) {
      #deck { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .up { min-height: 68px; padding: 8px 10px 10px; grid-template-columns: 28px minmax(0, 1fr); column-gap: 8px; }
      .up .ic { width: 27px; height: 27px; grid-row: 1 / 4; }
      .up .nt { min-height: 0; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .up .pr { grid-column: 2; margin-top: 3px; font-size: 15px; }
      #rush { width: 74px; height: 74px; }
      .stat { height: 44px; padding: 0 10px; } #sMoney b { font-size: 19px; } .sq { width: 44px; }
    }
    @media (max-height: 520px) {
      #deck { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
      .up { min-height: 60px; padding: 7px 8px 9px; grid-template-columns: 24px minmax(0, 1fr); column-gap: 7px; }
      .up .ic { width: 24px; height: 24px; grid-row: 1 / 3; }
      .up .nm { font-size: 12.5px; white-space: nowrap; } .up .nm i { display: none; } .up .nt { display: none; }
      .up .pr { grid-column: 2; margin-top: 2px; font-size: 14px; }
      #rush { width: 66px; height: 66px; } #rush b { display: none; }
      #next { height: 48px; }
      #goal { width: min(280px, 46%); } #toasts { top: calc(62px + var(--st)); left: auto; right: calc(8px + var(--sr)); transform: none; width: min(360px, 48%); }
    }
    @media (prefers-reduced-motion: reduce) { .pop, .toast, #rush.on { animation-duration: .01s; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div id="labels"></div>
    <div id="top">
      <div class="stat glass" id="sMoney"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.800 9.200c-.5-1-1.500-1.500-2.800-1.500-1.700 0-2.900.8-2.900 2.100 0 3 5.900 1.400 5.900 4.300 0 1.300-1.300 2.200-3 2.200-1.500 0-2.700-.6-3.200-1.700M12 6v1.700M12 16.300V18"/></svg>
        <div><b class="num" id="money">0</b><small class="num" id="rate">+0 / min</small></div></div>
      <div class="stat glass" id="sGuests"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.200"/><path d="M3 19.500c0-3.300 2.700-5.500 6-5.500s6 2.200 6 5.500M16 5.200a3.200 3.200 0 0 1 0 5.800M17.500 14.300c2.100.7 3.500 2.600 3.500 5.200"/></svg>
        <b class="num" id="guests">0</b><small class="num" id="guestCap">/ 10</small></div>
      <div class="stat glass" id="sFame" hidden title="Fame multiplies all income"></div>
      <span class="grow"></span>
      <button class="stat glass sq" id="viewBtn" aria-label="Show the whole resort"></button>
      <button class="stat glass sq" id="menuBtn" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div id="goal" class="glass"><div class="t"><span><b>Goal</b><span id="goalText"></span></span><span class="rw num" id="goalReward"></span></div><div class="meter"><i id="goalBar"></i></div></div>
    <div id="toasts"></div>
    <button id="next" hidden></button>
    <button id="rush"></button>
    <div id="deck"></div>
  </div>

  <section id="menu">
    <div class="box">
      <h1>First Chair</h1>
      <p>Your ski resort runs itself. Guests ride, ski and pay. You decide what the money buys next.</p>
      <button class="btn gold" id="playBtn">Play</button>
      <button class="btn" id="howBtn">How to play</button>
      <small id="menuNote"></small>
    </div>
  </section>

  <div id="sheet" hidden><div id="sheetBox"><button class="x" id="sheetX" aria-label="Close">&times;</button><h2 id="sheetTitle"></h2><div id="sheetBody"></div></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
