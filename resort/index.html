<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f6e4d6">
  <meta name="description" content="Idle Lift: an idle ski resort on a 3D mountain. Guests ride and ski on their own, you spend the money on lifts, speed, more guests and higher prices. Plays in the browser on phone and PC.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Idle Lift</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
  <style>
    /* Alpine look: wooden boards, piste-sign badges, brass price plates, paper notices. */
    :root { color-scheme: dark; --ink: #14202e; --text: #fff4dc; --brown: #3a2410; --edge: #4f3217; --paper: #fbf0d8; --paper2: #efdfbd; --dim: #e4cfa6;
      --gold: #ffcf4d; --good: #2f9e57; --bad: #d8453b; --green: #2fa35a; --blue: #2f7fe6; --red: #e04848; --black: #2a2f37; --orange: #f08a24; --purple: #8e5bd0;
      --display: 'Fredoka', 'Baloo 2', 'Arial Rounded MT Bold', system-ui, sans-serif;
      --font: 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
      --wood: repeating-linear-gradient(91deg, rgba(60, 30, 5, .11) 0 1px, transparent 1px 7px), repeating-linear-gradient(88.500deg, rgba(255, 232, 185, .09) 0 2px, transparent 2px 13px), linear-gradient(180deg, #c9945b, #aa7541 55%, #976530);
      --wood-dull: repeating-linear-gradient(91deg, rgba(40, 25, 10, .12) 0 1px, transparent 1px 7px), linear-gradient(180deg, #8f7a63, #74624e 55%, #665543);
      --wood-dark: repeating-linear-gradient(91deg, rgba(0, 0, 0, .16) 0 1px, transparent 1px 7px), linear-gradient(180deg, #6b4a2b, #563a20);
      --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    /* Fixed in place so a phone cannot scroll it by a few pixels. The sky colour behind the
       canvas means any gap under a sliding browser bar blends in instead of showing a dark line. */
    html, body { margin: 0; height: 100%; overflow: hidden; position: fixed; inset: 0; background: #f6e4d6; color: var(--text); font-family: var(--font);
      user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
    canvas#game { position: fixed; left: 0; top: 0; width: 100%; height: 100%; height: 100dvh; display: block; touch-action: none; background: #f6e4d6; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: .15em solid #fff; outline-offset: .12em; }
    .ic { width: 1.5em; height: 1.5em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .num { font-variant-numeric: tabular-nums; }

    /* A wooden board with a carved edge and two bolts. */
    .board { position: relative; background: var(--wood); border: .13em solid var(--edge); border-radius: .75em; color: var(--text); text-shadow: 0 .07em 0 rgba(50, 25, 5, .65);
      box-shadow: inset 0 .12em 0 rgba(255, 236, 200, .5), inset 0 -.16em 0 rgba(60, 30, 5, .28), 0 .26em 0 #3f2710, 0 .5em .7em rgba(0, 0, 0, .32); }
    .board::before, .board::after { content: ''; position: absolute; top: .38em; width: .34em; height: .34em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f4e3bd, #7d6a48 60%, #4a3b22); box-shadow: 0 .05em 0 rgba(0, 0, 0, .35); pointer-events: none; }
    .board::before { left: .42em; } .board::after { right: .42em; }

    /* One size unit for everything: 1em of the HUD follows the size of the window. */
    #hud, #menu, #sheet { font-size: clamp(10px, min(1.04vw, 2.1vh), 24px); }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 2; --side: 20.4em; }
    #hud > * { pointer-events: auto; }
    @media (orientation: portrait) {
      #hud, #menu, #sheet { font-size: clamp(9px, min(2.9vw, 1.55vh), 18px); }
      #hud { --side: 0em; }
    }

    /* ---------- top: money sign, guests, round buttons ---------- */
    #top { position: absolute; left: calc(.6em + var(--sl)); right: calc(.6em + var(--sr) + var(--side)); top: calc(.6em + var(--st)); display: flex; gap: .5em; align-items: stretch; pointer-events: none; }
    #top > * { pointer-events: auto; }
    .stat { display: flex; align-items: center; gap: .55em; height: 3.7em; padding: 0 1em; white-space: nowrap; font-family: var(--display); }
    .stat b { font-size: 1.3em; font-weight: 400; } .stat small { color: var(--dim); font-size: .95em; }
    #sMoney { gap: .6em; min-width: 9.6em; padding-left: .8em; }
    .coin { width: 2.3em; height: 2.3em; flex: none; display: block; filter: drop-shadow(0 .08em 0 rgba(0, 0, 0, .3)); }
    .coinpic { width: 100%; height: 100%; display: block; }
    #sMoney b { font-size: 1.85em; line-height: .95; display: block; letter-spacing: .01em; }
    #sMoney small { color: #c9f5b4; display: block; margin-top: .12em; font-size: 1em; }
    #sMoney.bump b { animation: bump .28s ease-out; }
    @keyframes bump { 40% { transform: scale(1.12); } }
    #sFame { color: var(--gold); font-size: 1.15em; }
    .grow { flex: 1 1 0; min-width: 0; }
    .sq { width: 3.7em; justify-content: center; padding: 0; transition: transform .09s ease-out; } .sq .ic { width: 1.7em; height: 1.7em; }
    .sq:active { transform: translateY(.18em); }

    /* The current quest: a paper trail marker. Tap it for the whole list. */
    #goal { position: absolute; left: calc(.6em + var(--sl)); top: calc(5em + var(--st)); width: min(24em, calc(100% - 1.2em - var(--side) - var(--sl) - var(--sr))); padding: .55em .9em .65em 3.1em; border-radius: .7em; line-height: 1.25; text-align: left;
      background: linear-gradient(180deg, var(--paper), var(--paper2)); color: var(--brown); border: .12em solid var(--edge); box-shadow: 0 .22em 0 #3f2710, 0 .45em .6em rgba(0, 0, 0, .28); display: block; }
    #goal::before { content: ''; position: absolute; left: .7em; top: 50%; width: 1.7em; height: 1.7em; margin-top: -.85em; border-radius: 50%; background: var(--red); border: .16em solid #fff; box-shadow: 0 0 0 .08em var(--edge); }
    #goal::after { content: '!'; position: absolute; left: .7em; top: 50%; width: 1.7em; margin-top: -.62em; text-align: center; color: #fff; font-family: var(--display); font-size: 1em; }
    #goal .t { display: flex; justify-content: space-between; gap: .6em; align-items: baseline; }
    #goal .t b { font-family: var(--display); font-weight: 400; font-size: .82em; letter-spacing: .08em; text-transform: uppercase; color: #8a5a2b; display: block; }
    #goal #goalText { font-weight: 650; } #goal .rw { color: var(--good); font-family: var(--display); font-size: 1.1em; white-space: nowrap; }
    .meter { height: .5em; border-radius: .3em; background: rgba(90, 55, 20, .22); overflow: hidden; margin-top: .4em; } .meter i { display: block; height: 100%; border-radius: .3em; background: var(--green); transition: width .3s; }

    #labels { position: absolute; inset: 0; pointer-events: none !important; overflow: hidden; }
    .tag { position: absolute; left: 0; top: 0; padding: .12em .6em; border-radius: .5em; font-size: .9em; font-weight: 700; color: var(--brown);
      background: var(--paper); border: .1em solid var(--edge); white-space: nowrap; will-change: transform; }
    .tag.warn { background: #ffd66b; } .tag.bad { background: #ff8a7a; }
    .pop { position: absolute; left: 0; top: 0; font-family: var(--display); font-size: 1.3em; color: #ffe07a; white-space: nowrap; text-shadow: 0 .08em 0 #4a2f05, 0 0 .35em rgba(0, 0, 0, .6); will-change: transform, opacity; opacity: 0; }
    .pop.trick { font-size: 1.7em; color: #fff; text-shadow: 0 .08em 0 #b3392f, 0 0 .4em rgba(0, 0, 0, .6); }
    .fly { position: absolute; left: 0; top: 0; width: 1.35em; height: 1.35em; will-change: transform, opacity; opacity: 0; }

    /* ---------- the upgrade boards ---------- */
    #deck { position: absolute; right: calc(.3em + var(--sr)); top: calc(.3em + var(--st)); bottom: calc(.3em + var(--sb)); width: calc(var(--side) - .3em); padding: .3em .45em .7em .3em;
      display: flex; flex-direction: column; gap: .62em; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; scrollbar-width: none; overscroll-behavior: contain; }
    #deck::-webkit-scrollbar { display: none; }
    .up { flex: none; height: 5.5em; text-align: left; touch-action: pan-y;
      display: grid; grid-template-columns: 2.9em minmax(0, 1fr) auto; grid-template-areas: "bd nm pr" "bd nt pr"; column-gap: .7em; row-gap: .2em; align-content: center; align-items: center;
      padding: .5em .8em .65em .7em; transition: transform .09s ease-out, box-shadow .09s ease-out; }
    .up .bd { grid-area: bd; position: relative; width: 2.9em; height: 2.9em; border-radius: 50%; display: grid; place-items: center; color: #fff; border: .17em solid #fff; background: var(--c, var(--blue)); box-shadow: 0 0 0 .08em var(--edge), 0 .12em .2em rgba(0, 0, 0, .35); text-shadow: none; }
    .up .bd .ic { width: 1.75em; height: 1.75em; }
    .up .nm { grid-area: nm; font-family: var(--display); font-size: 1.28em; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .up .bi { display: grid; place-items: center; }
    /* The level sits as a small chip under the round badge. */
    .up .lv { position: absolute; left: 50%; bottom: -.62em; transform: translateX(-50%); font-style: normal; font-size: .62em; font-weight: 800; line-height: 1; padding: .18em .45em; border-radius: .6em;
      white-space: nowrap; background: #fff4dc; color: var(--brown); border: .12em solid var(--edge); text-shadow: none; }
    .up .lv:empty { display: none; }
    .up .nt { grid-area: nt; font-size: .88em; color: #ffe9c2; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 .06em 0 rgba(50, 25, 5, .55); }
    .up .pr { grid-area: pr; justify-self: end; display: flex; align-items: center; gap: .3em; padding: .08em .6em .1em .35em; border-radius: .5em; font-family: var(--display); font-size: 1.22em; color: var(--brown); text-shadow: none; white-space: nowrap;
      background: linear-gradient(180deg, #ffe793, #efba45); border: .08em solid #946a13; box-shadow: inset 0 .08em 0 rgba(255, 255, 255, .6); font-variant-numeric: tabular-nums; }
    .up .pr .coinpic { width: .86em; height: .86em; flex: none; } .up .pr b { font-weight: 400; }
    .up .fill { position: absolute; left: .5em; right: .5em; bottom: .22em; height: .2em; border-radius: .1em; background: rgba(60, 30, 5, .35); overflow: hidden; }
    .up .fill i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left; transform: scaleX(0); transition: transform .25s linear; }
    .up.no { background: var(--wood-dull); } .up.no .bd { filter: saturate(.45) brightness(.9); }
    .up.no .pr { background: linear-gradient(180deg, #ddd2bf, #b7aa94); border-color: #7c705c; color: #5d5140; } .up.no .pr .coinpic { filter: grayscale(1); }
    .up.can { animation: ready .45s ease-out; }
    @keyframes ready { 30% { transform: rotate(-1.2deg) scale(1.03); } 65% { transform: rotate(.8deg); } }
    @media (hover: hover) { .up.can:hover { filter: brightness(1.07); } }
    .up.can:active, .up.hit { transform: translateY(.2em); box-shadow: inset 0 .12em 0 rgba(255, 236, 200, .5), inset 0 -.1em 0 rgba(60, 30, 5, .28), 0 .06em 0 #3f2710, 0 .2em .3em rgba(0, 0, 0, .3); }
    .up.max .pr { background: linear-gradient(180deg, #c9f1b8, #86cf6c); border-color: #3f7d2c; color: #1d4a12; } .up.max .pr .coinpic, .up.locked .pr .coinpic { display: none; } .up.max .fill, .up.locked .fill { display: none; }
    .up.locked { background: var(--wood-dark); order: 2; } .up.locked .bd { background: #4a4038; border-color: #a89880; color: #d9c8a8; }
    .up.locked .nm { color: #d9c8a8; } .up.locked .pr { background: none; border: 0; box-shadow: none; color: #d9c8a8; padding: 0; font-size: .95em; } .up.locked .lv { display: none; }

    #rush { position: absolute; left: calc(.8em + var(--sl)); bottom: calc(.9em + var(--sb)); width: 6.4em; height: 6.4em; border-radius: 50%; display: grid; place-items: center; align-content: center; gap: .05em;
      background: radial-gradient(circle at 35% 28%, #ffb35c, #e8552f 62%, #b3331c); color: #fff; border: .22em solid #fff; box-shadow: 0 0 0 .12em var(--edge), 0 .3em 0 .1em #5e1d0e, 0 .7em 1em rgba(0, 0, 0, .4); font-family: var(--display); line-height: 1.05; transition: transform .09s ease-out; text-shadow: 0 .07em 0 rgba(90, 20, 5, .7); }
    #rush .ic { width: 2.1em; height: 2.1em; stroke-width: 2.3; } #rush b { font-size: .95em; font-weight: 400; }
    #rush.wait { background: radial-gradient(circle at 35% 28%, #8d8f95, #5d6067 62%, #43464c); box-shadow: 0 0 0 .12em var(--edge), 0 .3em 0 .1em #2c2e33; border-color: #cfd3d8; text-shadow: none; }
    #rush.on { animation: glow .7s ease-in-out infinite alternate; }
    @keyframes glow { from { box-shadow: 0 0 0 .12em var(--edge), 0 0 0 .2em rgba(255, 190, 80, .9); } to { box-shadow: 0 0 0 .12em var(--edge), 0 0 0 1em rgba(255, 190, 80, 0); } }
    #rush:active { transform: translateY(.2em); }

    #next { position: absolute; left: calc((100% - var(--side)) / 2); bottom: calc(1.4em + var(--sb)); transform: translateX(-50%); height: 3.5em; padding: 0 1.5em; border-radius: .8em; background: linear-gradient(180deg, #ffe793, #efba45); color: var(--brown); border: .13em solid #946a13;
      box-shadow: inset 0 .1em 0 rgba(255, 255, 255, .6), 0 .26em 0 #7a560c, 0 .6em 1em rgba(0, 0, 0, .4); display: flex; align-items: center; gap: .5em; white-space: nowrap; font-family: var(--display); }
    #next span { font-size: 1.3em; }

    /* Event sign: a wooden board under the quest marker. */
    #event { position: absolute; left: calc(.6em + var(--sl)); top: calc(9.7em + var(--st)); width: min(24em, calc(100% - 1.2em - var(--side) - var(--sl) - var(--sr))); box-sizing: border-box;
      display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; grid-template-areas: "ic tx tm" "bt bt bt"; gap: .35em .6em; align-items: center; padding: .55em .7em .6em; border-radius: .7em; pointer-events: auto; animation: evIn .35s ease-out; }
    #event > span { grid-area: ic; width: 2.4em; height: 2.4em; border-radius: 50%; display: grid; place-items: center; background: #3aa6c9; border: .14em solid #fff; box-shadow: 0 0 0 .08em var(--edge); }
    #event.storm > span { background: #5d6a7a; } #event.celeb > span { background: #e6a70f; }
    #event > span .ic { width: 1.4em; height: 1.4em; color: #fff; }
    #event > div { grid-area: tx; line-height: 1.2; } #event b { font-family: var(--display); font-weight: 400; font-size: 1.15em; display: block; }
    #event small { display: block; font-size: .85em; color: #ffe9c2; } #event #evTime { grid-area: tm; font-style: normal; font-family: var(--display); font-size: 1.2em; }
    #event button { grid-area: bt; height: 2.4em; font-family: var(--display); font-size: 1.05em; background: linear-gradient(180deg, #ffe793, #efba45); color: var(--brown); border: .1em solid #946a13; border-radius: .6em; text-shadow: none; box-shadow: 0 .18em 0 #7a560c; }
    #event button:active { transform: translateY(.15em); }
    #event.celeb button, #event.storm button { animation: glow .8s ease-in-out infinite alternate; }
    @keyframes evIn { from { transform: translateX(-1em); opacity: 0; } }
    #hud.ev #toasts { top: calc(16.2em + var(--st)); }
    .btn.off { filter: grayscale(.8); opacity: .75; }
    .btn .coinpic { width: 1.1em; height: 1.1em; }
    #sheetBody p.big { display: flex; align-items: center; justify-content: center; gap: .4em; font-family: var(--display); font-size: 2.2em; margin: .2em 0 .5em; color: var(--good); }
    #sheetBody p.big .coinpic { width: 1em; height: 1em; } #sheetBody p.big b { font-weight: 400; }
    .tag.star { background: #ffd23a; color: #5a3a00; font-family: var(--display); font-weight: 400; animation: glow .8s ease-in-out infinite alternate; }
    #toasts { position: absolute; left: calc((100% - var(--side)) / 2); top: calc(9.4em + var(--st)); transform: translateX(-50%); width: min(29em, calc(100% - var(--side) - 1.4em)); display: grid; gap: .45em; pointer-events: none !important; }
    .toast { padding: .6em 1em; border-radius: .6em; background: linear-gradient(180deg, var(--paper), var(--paper2)); color: var(--brown); border: .12em solid var(--edge); line-height: 1.35; text-align: center; box-shadow: 0 .22em 0 #3f2710, 0 .5em .8em rgba(0, 0, 0, .3);
      animation: tin .28s cubic-bezier(.2, 1.4, .5, 1); transition: opacity .35s; }
    .toast b { font-family: var(--display); font-weight: 400; } .toast.star b { color: #b3541a; } .toast.out { opacity: 0; }
    @keyframes tin { from { transform: translateY(-.8em) rotate(-1.5deg); opacity: 0; } }

    /* Wide but low (a phone held sideways): slimmer boards, no second line. */
    @media (orientation: landscape) and (max-height: 540px) {
      #hud, #menu, #sheet { font-size: clamp(9px, min(1.04vw, 2.4vh), 14px); }
      .up { height: 4em; grid-template-columns: 2.5em minmax(0, 1fr) auto; grid-template-areas: "bd nm pr" "bd nm pr"; row-gap: .1em; padding: .35em .7em .5em .6em; }
      .up .nt { display: none; } .up .bd { width: 2.5em; height: 2.5em; } .up .lv { font-size: .55em; } .up .nm { font-size: 1.12em; } .up .pr { font-size: 1.05em; }
      #deck { gap: .5em; } #rush { width: 5.2em; height: 5.2em; }
    }

    /* Upright: two rows of tiles along the bottom, swipe sideways for more. */
    @media (orientation: portrait) {
      #deck { left: 0; right: 0; top: auto; bottom: calc(.2em + var(--sb)); width: auto; padding: .3em calc(.5em + var(--sr)) .6em calc(.5em + var(--sl));
        display: grid; grid-template-rows: repeat(2, auto); grid-auto-flow: column; grid-auto-columns: calc((100% - 1.1em) / 3.6); gap: .55em .5em; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; }
      .up { height: auto; touch-action: pan-x; grid-template-columns: 2.1em minmax(0, 1fr); grid-template-areas: "bd bd" "nm nm" "nt nt" "pr pr"; row-gap: .08em; padding: .42em .55em .62em; justify-items: start; }
      .up .bd { width: 2.1em; height: 2.1em; } .up .bd .ic { width: 1.3em; height: 1.3em; } .up .lv { font-size: .52em; bottom: -.7em; } .up .pr { justify-self: start; }
      .up .nm { font-size: 1.08em; margin-top: .15em; max-width: 100%; } .up .nt { font-size: .76em; max-width: 100%; } .up .pr { font-size: 1.08em; margin-top: .1em; }
      .up.locked { order: 2; }
      #rush { left: auto; right: calc(.7em + var(--sr)); bottom: calc(var(--deck-h, 14em) + 1.2em + var(--sb)); width: 5.4em; height: 5.4em; }
      #next { bottom: calc(var(--deck-h, 14em) + 1.5em + var(--sb)); }
      #sMoney { min-width: 8.4em; } .stat { padding: 0 .7em; height: 3.5em; } .sq { width: 3.5em; }
      #top { gap: .38em; } #questBtn, #guestCap { display: none; }
    }

    /* ---------- start screen and notices ---------- */
    #menu { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: calc(1.4em + var(--st)) 1.4em calc(1.4em + var(--sb));
      background: linear-gradient(180deg, rgba(20, 32, 46, .35), rgba(20, 32, 46, .72)); }
    #menu .box { width: min(27em, 100%); text-align: center; }
    #menu h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.6em, 11vw, 4.2em); margin: 0; line-height: 1; padding: .34em .5em .4em; transform: rotate(-1.5deg); }
    #menu h1::before, #menu h1::after { top: .2em; width: .16em; height: .16em; }
    #menu p { color: #fff4dc; font-size: 1.12em; line-height: 1.45; margin: 1.3em .4em 1.5em; text-shadow: 0 .06em .4em rgba(0, 0, 0, .7); }
    .btn { display: flex; align-items: center; justify-content: center; gap: .5em; width: 100%; height: 3.3em; font-family: var(--display); font-size: 1.15em; transition: transform .09s ease-out; }
    .btn:active { transform: translateY(.18em); }
    .btn.gold { height: 3.3em; font-size: 1.5em; background: linear-gradient(180deg, #ffe793, #efba45); color: var(--brown); border-color: #946a13; text-shadow: none; box-shadow: inset 0 .1em 0 rgba(255, 255, 255, .6), 0 .24em 0 #7a560c, 0 .5em .8em rgba(0, 0, 0, .35); }
    .btn.gold::before, .btn.gold::after { display: none; }
    .btn.bad { background: linear-gradient(180deg, #d8564a, #a8352b); border-color: #5e1d17; box-shadow: inset 0 .1em 0 rgba(255, 255, 255, .3), 0 .24em 0 #5e1d17; }
    .btn.bad::before, .btn.bad::after { display: none; }
    .btn + .btn { margin-top: .8em; }
    #menu small { display: block; margin-top: 1.2em; color: #fff4dc; font-size: .92em; text-shadow: 0 .06em .3em rgba(0, 0, 0, .7); }

    #sheet { position: fixed; inset: 0; z-index: 6; display: grid; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); place-items: center; padding: calc(1em + var(--st)) 1em calc(1em + var(--sb)); background: rgba(10, 16, 24, .62); }
    #sheetBox { width: min(31em, 100%); max-height: 100%; min-height: 0; display: flex; flex-direction: column; padding: .7em; border-radius: 1em; background: var(--wood); border: .14em solid var(--edge); position: relative; box-shadow: 0 .3em 0 #3f2710, 0 1.4em 4em rgba(0, 0, 0, .5); }
    #sheetBox h2 { font-family: var(--display); font-weight: 400; margin: .1em 2.4em .45em .4em; font-size: 1.6em; color: var(--text); text-shadow: 0 .07em 0 rgba(50, 25, 5, .65); }
    #sheetBody { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; padding: 1em; border-radius: .5em; background: linear-gradient(180deg, var(--paper), var(--paper2)); color: var(--brown); box-shadow: inset 0 .1em .4em rgba(60, 30, 5, .35); }
    #sheetBody p { line-height: 1.5; margin: 0 0 .8em; }
    #sheetBody ul { margin: 0 0 1em; padding-left: 1.3em; line-height: 1.55; }
    .x { position: absolute; right: .55em; top: .5em; width: 2em; height: 2em; border-radius: 50%; font-size: 1.15em; line-height: 1; background: var(--red); color: #fff; border: .14em solid #fff; box-shadow: 0 0 0 .08em var(--edge); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: .8em; padding: .7em 0; border-bottom: .08em dashed rgba(90, 55, 20, .35); font-size: 1.05em; font-weight: 600; }
    .row:last-child { border-bottom: 0; }
    .row input[type=range] { width: 11em; accent-color: #b3541a; touch-action: pan-x; }
    .seg { display: flex; border-radius: .6em; overflow: hidden; border: .1em solid var(--edge); }
    .seg button { padding: .5em .9em; font-weight: 700; color: #7a5a35; background: rgba(255, 255, 255, .35); } .seg button.on { background: #b3541a; color: #fff; }

    /* The quest list: one line per quest, like the legend of a trail map. */
    .q { display: grid; grid-template-columns: 1.9em minmax(0, 1fr) auto; column-gap: .7em; align-items: center; padding: .55em 0; border-bottom: .08em dashed rgba(90, 55, 20, .35); }
    .q:last-child { border-bottom: 0; }
    .q .dot { width: 1.9em; height: 1.9em; border-radius: 50%; border: .15em solid #fff; box-shadow: 0 0 0 .08em var(--edge); background: var(--blue); display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: .95em; }
    .q.locked { opacity: .7; } .q.locked .dot { background: #8b7a62; } .q.locked .dot .ic { width: 1em; height: 1em; } #sheetBody p.more { margin: .5em 0 0; font-size: .9em; color: #7a5a35; }
    .q.now .dot { background: var(--red); } .q.done .dot { background: var(--green); } .q.done { opacity: .62; }
    .q .tx { font-weight: 650; line-height: 1.2; } .q .tx small { display: block; font-weight: 500; color: #7a5a35; font-size: .85em; margin-top: .1em; }
    .q .rw { font-family: var(--display); color: var(--good); font-size: 1.1em; } .q .meter { grid-column: 2 / 4; margin-top: .3em; }
    .qhead { font-family: var(--display); font-size: .85em; letter-spacing: .08em; text-transform: uppercase; color: #8a5a2b; margin: .2em 0 .1em; }

    /* Parking: a blue P sign with the price under it. */
    #parkBtn { width: auto; padding: 0 .7em 0 .55em; gap: .45em; }
    #parkBtn .p { width: 1.9em; height: 1.9em; border-radius: .4em; display: grid; place-items: center; background: #2f6fd6; color: #fff; border: .12em solid #fff; box-shadow: 0 0 0 .07em var(--edge); font: 700 1.15em/1 var(--font); text-shadow: none; }
    #parkBtn b { font-weight: 400; font-size: 1.05em; min-width: 1.6em; text-align: left; }
    .pk { display: grid; gap: .5em; margin: .2em 0 .4em; }
    .pkopt { display: grid; grid-template-columns: 3.6em minmax(0, 1fr) auto; grid-template-areas: "t n r" "t g i"; column-gap: .7em; row-gap: .1em; align-items: center; text-align: left; padding: .55em .75em; border-radius: .7em;
      background: rgba(255, 255, 255, .5); border: .12em solid rgba(90, 55, 20, .3); color: var(--brown); transition: transform .09s ease-out; }
    .pkopt:active { transform: translateY(.12em); }
    .pkopt.on { background: #fff6dc; border-color: #b3541a; box-shadow: 0 0 0 .14em rgba(179, 84, 26, .35); }
    .pkopt .pkt { grid-area: t; height: 2.4em; border-radius: .5em; display: grid; place-items: center; font-family: var(--display); font-size: 1.05em; background: linear-gradient(180deg, #ffe793, #efba45); border: .1em solid #946a13; }
    .pkopt.free .pkt { background: linear-gradient(180deg, #7fd89a, #2fa35a); color: #fff; border-color: #1d6a38; }
    .pkopt .pkn { grid-area: n; font-family: var(--display); font-size: 1.15em; } .pkopt .pkg { grid-area: g; font-size: .88em; color: #7a5a35; }
    .pkopt .pkr { grid-area: r; font-family: var(--display); color: var(--good); white-space: nowrap; } .pkopt .pki { grid-area: i; font-size: .82em; color: #7a5a35; white-space: nowrap; }
    .pkopt .best { display: inline-block; margin-left: .4em; padding: .05em .45em; border-radius: .6em; background: var(--good); color: #fff; font: 700 .62em/1.4 var(--font); vertical-align: .25em; }

    /* Boards you can afford: a gold rim and a shine across the price. */
    .up.can { box-shadow: inset 0 .12em 0 rgba(255, 236, 200, .5), inset 0 -.16em 0 rgba(60, 30, 5, .28), 0 0 0 .13em rgba(255, 214, 90, .95), 0 .26em 0 #3f2710, 0 .5em .9em rgba(0, 0, 0, .32); }
    .up.can .pr { position: relative; overflow: hidden; }
    .up.can .pr::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .75) 50%, transparent 70%); transform: translateX(-130%); animation: shine 3s ease-in-out infinite; pointer-events: none; }
    @keyframes shine { 55%, 100% { transform: translateX(130%); } }
    @media (hover: hover) { .sq:hover, #goal:hover { filter: brightness(1.08); } }
    #sMoney small { font-family: var(--font); font-weight: 700; font-size: .8em; padding: .05em .45em; border-radius: .6em; background: rgba(30, 70, 20, .45); display: inline-block; }
    @media (orientation: portrait) {
      /* A frosted shelf behind the boards, so they read well over the snow. */
      #deck { background: linear-gradient(180deg, rgba(40, 26, 12, .18), rgba(40, 26, 12, .42)); border-radius: 1em 1em 0 0; -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); bottom: 0; padding-bottom: calc(.6em + var(--sb)); }
      #parkBtn b { display: none; } #parkBtn { padding: 0 .5em; }
    }

    /* Cozy: a cabin by the fire. Rounder corners, soft warm shadows, a friendly rounded font. */
    .board { border-radius: 1.1em; box-shadow: inset 0 .12em 0 rgba(255, 236, 200, .35), 0 .22em 0 #4a2e14, 0 .7em 1.4em rgba(80, 40, 10, .28); }
    #goal, .toast, .pkopt { border-radius: 1em; } #sheetBox { border-radius: 1.4em; } #sheetBody { border-radius: .9em; }
    .up .pr, #event button, .pkopt .pkt { border-radius: .8em; } #next { border-radius: 1.3em; } .seg { border-radius: .9em; } .tag, .up .lv { border-radius: 1em; }
    .stat b, .up .nm, #event b, #sheetBox h2, #menu h1, .btn, #next span { letter-spacing: .01em; }
    .up .nt, .row, .q .tx { font-weight: 700; }
    #menu h1 { font-weight: 600; }

    @media (prefers-reduced-motion: reduce) { .toast, #rush.on, .up.can, #sMoney.bump b { animation-duration: .01s; } .up.can .pr::after { animation: none; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div id="labels"></div>
    <div id="top">
      <div class="stat board" id="sMoney"><span class="coin"></span><div><b class="num" id="money">0</b><small class="num" id="rate">+0 / s</small></div></div>
      <div class="stat board" id="sGuests"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.200"/><path d="M3 19.500c0-3.300 2.700-5.500 6-5.500s6 2.200 6 5.500M16 5.200a3.200 3.200 0 0 1 0 5.800M17.500 14.300c2.100.7 3.500 2.600 3.500 5.200"/></svg>
        <b class="num" id="guests">0</b><small class="num" id="guestCap">/ 10</small></div>
      <div class="stat board" id="sFame" hidden title="Fame multiplies all income"></div>
      <span class="grow"></span>
      <button class="stat board sq" id="parkBtn" aria-label="Parking prices" title="Parking prices"><span class="p">P</span><b id="parkTag">$</b></button>
      <button class="stat board sq" id="questBtn" aria-label="Quests"></button>
      <button class="stat board sq" id="viewBtn" aria-label="Show the whole resort"></button>
      <button class="stat board sq" id="menuBtn" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <button id="goal" aria-label="Show all quests"><div class="t"><span><b>Quest</b><span id="goalText"></span></span><span class="rw num" id="goalReward"></span></div><div class="meter"><i id="goalBar"></i></div></button>
    <div id="event" class="board" hidden><span id="evIcon"></span><div><b id="evName"></b><small id="evText"></small></div><i id="evTime" class="num"></i><button id="evBtn" class="board"></button></div>
    <div id="toasts"></div>
    <button id="next" hidden></button>
    <button id="rush"></button>
    <div id="deck"></div>
  </div>

  <section id="menu">
    <div class="box">
      <h1 class="board">Idle Lift</h1>
      <p>Your ski resort runs itself. Guests ride, ski and pay. You decide what the money buys next.</p>
      <button class="btn board gold" id="playBtn">Play</button>
      <button class="btn board" id="howBtn">How to play</button>
      <small id="menuNote"></small>
    </div>
  </section>

  <div id="sheet" hidden><div id="sheetBox"><button class="x" id="sheetX" aria-label="Close">&times;</button><h2 id="sheetTitle"></h2><div id="sheetBody"></div></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
